<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="118" y1="92" x2="906" y2="934" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27B8FF"/>
      <stop offset="0.48" stop-color="#2674ED"/>
      <stop offset="1" stop-color="#5B3DE1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(512 468) rotate(90) scale(430)">
      <stop stop-color="#69E4FF" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#69E4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terminal" x1="282" y1="356" x2="748" y2="688" gradientUnits="userSpaceOnUse">
