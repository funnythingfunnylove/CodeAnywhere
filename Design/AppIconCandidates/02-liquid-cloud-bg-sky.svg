<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="0.38" cy="0.18" r="1.05">
      <stop stop-color="#78D5FF"/>
      <stop offset="0.32" stop-color="#4D9FEB"/>
      <stop offset="0.68" stop-color="#2865BE"/>
      <stop offset="1" stop-color="#0A2E76"/>
    </radialGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(230 116) rotate(44) scale(730)">
      <stop stop-color="#E8FAFF" stop-opacity="0.25"/>
      <stop offset="0.42" stop-color="#C4F2FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#C4F2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="calmGlow" cx="0" cy="0" r="1" gradientTransform="translate(846 880) rotate(-132) scale(650)">
      <stop stop-color="#72EEFF" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#46D7F2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#46D7F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudGlass" x1="190" y1="220" x2="870" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.43"/>
      <stop offset="0.36" stop-color="#F0E7FF" stop-opacity="0.19"/>
      <stop offset="0.70" stop-color="#A9F4FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="cloudRim" x1="178" y1="214" x2="894" y2="792" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.70" stop-color="#8DFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#D8FFFF" stop-opacity="0.77"/>
    </linearGradient>
    <linearGradient id="glyph" x1="328" y1="380" x2="704" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F5FEFF"/>
      <stop offset="1" stop-color="#C9EDF7"/>
    </linearGradient>
    <linearGradient id="glyphDepth" x1="328" y1="380" x2="704" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9E5F1"/>
      <stop offset="1" stop-color="#4A8DAF"/>
    </linearGradient>

    <!-- Circle-derived cloud silhouette joined with tangent cubic Bezier arcs. -->
    <path id="cloud" d="M275 770C185 770 112 698 112 608C112 527 173 459 252 449C270 331 371 242 493 242C630 242 746 344 760 474C839 501 890 573 890 651C890 715 843 762 782 770C636 781 414 781 275 770Z"/>
    <clipPath id="cloudClip"><use href="#cloud"/></clipPath>

    <filter id="shadow" x="44" y="116" width="956" height="756" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="36" stdDeviation="39" flood-color="#170056" flood-opacity="0.43"/>
    </filter>
    <filter id="blur" x="100" y="88" width="850" height="850" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="glyphShadow" x="260" y="300" width="560" height="470" filterUnits="userSpaceOnUse">
      <feDropShadow dx="9" dy="13" stdDeviation="9" flood-color="#073A70" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Restrained two-tone background keeps attention on the glass cloud. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#aura)"/>
  <rect width="1024" height="1024" fill="url(#calmGlow)"/>

  <!-- A single cloud-shaped Liquid Glass body. -->
  <g filter="url(#shadow)">
    <use href="#cloud" fill="url(#cloudGlass)"/>
    <g clip-path="url(#cloudClip)">
      <circle cx="316" cy="314" r="210" fill="#FFFFFF" opacity="0.07"/>
      <circle cx="782" cy="708" r="246" fill="#5AF4FF" opacity="0.08"/>
      <circle cx="134" cy="786" r="282" fill="#FF65D2" opacity="0.06"/>
    </g>
    <use href="#cloud" fill="none" stroke="url(#cloudRim)" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- Specular highlights are positioned fully inside the cloud surface. -->
  <path d="M263 478C292 365 390 292 518 282C401 316 339 378 304 485C287 536 248 529 263 478Z" fill="#FFFFFF" opacity="0.32"/>
  <path d="M827 643C798 709 727 745 624 752C717 726 766 687 794 619C810 581 844 604 827 643Z" fill="#8DFFFF" opacity="0.20"/>

  <!-- Terminal mark: subtle thickness and shadow, lit from upper-left. -->
  <g transform="translate(40.96 40.96) scale(0.92) translate(8 10)" opacity="0.68" filter="url(#glyphShadow)" stroke="url(#glyphDepth)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 402L492 512L342 622" fill="none"/>
    <path d="M552 626H702"/>
  </g>
  <g transform="translate(40.96 40.96) scale(0.92)" stroke="url(#glyph)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 402L492 512L342 622" fill="none"/>
    <path d="M552 626H702"/>
  </g>
</svg>
