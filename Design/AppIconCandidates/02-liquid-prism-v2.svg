      <stop offset="1" stop-color="#0FBAD6"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(728 238) rotate(126) scale(690)">
      <stop stop-color="#A8FBFF" stop-opacity="0.70"/>
      <stop offset="0.38" stop-color="#70E8FF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#70E8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassA" x1="176" y1="176" x2="720" y2="696" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.46" stop-color="#E6DCFF" stop-opacity="0.14"/>
