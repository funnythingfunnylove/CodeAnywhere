    <ellipse cx="414" cy="425" rx="279" ry="231" transform="rotate(-18 414 425)" fill="none" stroke="url(#rimA)" stroke-width="13"/>

    <ellipse cx="636" cy="468" rx="244" ry="304" transform="rotate(17 636 468)" fill="url(#glassB)"/>
    <ellipse cx="636" cy="468" rx="237" ry="297" transform="rotate(17 636 468)" fill="none" stroke="url(#rimB)" stroke-width="13"/>

    <ellipse cx="472" cy="674" rx="310" ry="202" transform="rotate(12 472 674)" fill="url(#glassC)"/>
    <ellipse cx="472" cy="674" rx="303" ry="195" transform="rotate(12 472 674)" fill="none" stroke="url(#rimC)" stroke-width="13"/>
